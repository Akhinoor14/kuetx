<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sign in vs sign up flow with isNewUser branching</title>
<desc>Two entry points, Sign in and Sign up, each leading through Google auth to a branch based on whether the account is new</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:-apple-system,'Segoe UI',sans-serif;fill:#1a1a18}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5f5e5a}
.box{fill:#f1efe8;stroke:#b4b2a9;stroke-width:0.5}
.amber{fill:#faeeda;stroke:#ba7517;stroke-width:0.5}
.teal{fill:#e1f5ee;stroke:#0f6e56;stroke-width:0.5}
.coral{fill:#faece7;stroke:#993c1d;stroke-width:0.5}
.purple{fill:#eeedfe;stroke:#534ab7;stroke-width:0.5}
.gray{fill:#f1efe8;stroke:#5f5e5a;stroke-width:0.5}
.conn{stroke:#888780;stroke-width:0.5;fill:none}
</style>

<g><rect class="gray" x="60" y="30" width="150" height="44" rx="8"/><text class="th" x="135" y="52" text-anchor="middle" dominant-baseline="central">Tap Sign in</text></g>
<g><rect class="purple" x="470" y="30" width="150" height="56" rx="8"/><text class="th" x="545" y="48" text-anchor="middle" dominant-baseline="central">Tap Sign up</text><text class="ts" x="545" y="66" text-anchor="middle" dominant-baseline="central">Role and profile form</text></g>

<line x1="135" y1="74" x2="135" y2="110" class="conn" marker-end="url(#arrow)"/>
<line x1="545" y1="86" x2="545" y2="110" class="conn" marker-end="url(#arrow)"/>

<g><rect class="gray" x="60" y="110" width="150" height="44" rx="8"/><text class="th" x="135" y="132" text-anchor="middle" dominant-baseline="central">Google popup</text></g>
<g><rect class="purple" x="470" y="110" width="150" height="44" rx="8"/><text class="th" x="545" y="132" text-anchor="middle" dominant-baseline="central">Google popup</text></g>

<line x1="135" y1="154" x2="135" y2="190" class="conn" marker-end="url(#arrow)"/>
<line x1="545" y1="154" x2="545" y2="190" class="conn" marker-end="url(#arrow)"/>

<g><rect class="amber" x="60" y="190" width="150" height="56" rx="8"/><text class="th" x="135" y="208" text-anchor="middle" dominant-baseline="central">isNewUser?</text><text class="ts" x="135" y="226" text-anchor="middle" dominant-baseline="central">Firebase result</text></g>
<g><rect class="amber" x="470" y="190" width="150" height="56" rx="8"/><text class="th" x="545" y="208" text-anchor="middle" dominant-baseline="central">isNewUser?</text><text class="ts" x="545" y="226" text-anchor="middle" dominant-baseline="central">Firebase result</text></g>

<path d="M110 246 L110 280 L60 280" class="conn" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="270">false</text>
<path d="M160 246 L160 280 L260 280" class="conn" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="270">true</text>

<path d="M520 246 L520 280 L420 280" class="conn" marker-end="url(#arrow)"/>
<text class="ts" x="440" y="270">true</text>
<path d="M570 246 L570 280 L650 280" class="conn" marker-end="url(#arrow)"/>
<text class="ts" x="600" y="270">false</text>

<g><rect class="teal" x="10" y="280" width="140" height="56" rx="8"/><text class="th" x="80" y="298" text-anchor="middle" dominant-baseline="central">Go to dashboard</text><text class="ts" x="80" y="316" text-anchor="middle" dominant-baseline="central">Existing account</text></g>

<g><rect class="coral" x="230" y="280" width="150" height="66" rx="8"/><text class="th" x="305" y="300" text-anchor="middle" dominant-baseline="central">isNewUser: true</text><text class="ts" x="305" y="318" text-anchor="middle" dominant-baseline="central">Show &quot;sign up first&quot;</text><text class="ts" x="305" y="334" text-anchor="middle" dominant-baseline="central">inline notice, no delete</text></g>

<g><rect class="teal" x="390" y="280" width="150" height="66" rx="8"/><text class="th" x="465" y="300" text-anchor="middle" dominant-baseline="central">Write profile data</text><text class="ts" x="465" y="318" text-anchor="middle" dominant-baseline="central">Go straight to</text><text class="ts" x="465" y="334" text-anchor="middle" dominant-baseline="central">dashboard</text></g>

<g><rect class="coral" x="570" y="280" width="100" height="66" rx="8"/><text class="th" x="620" y="300" text-anchor="middle" dominant-baseline="central">Sign in</text><text class="ts" x="620" y="318" text-anchor="middle" dominant-baseline="central">instead, form</text><text class="ts" x="620" y="334" text-anchor="middle" dominant-baseline="central">data dropped</text></g>

</svg>
