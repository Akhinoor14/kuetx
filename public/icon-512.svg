<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#14532d"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" opacity="0.12"/>

  <!-- Turtle Shell -->
  <ellipse cx="256" cy="256" rx="148" ry="132" fill="#16a34a"/>

  <!-- Shell hex pattern -->
  <polygon points="256,180 302,206 302,258 256,284 210,258 210,206" fill="#15803d" stroke="#14532d" stroke-width="3"/>
  <polygon points="256,148 302,174 302,180 256,154 210,180 210,174" fill="#0f4c21"/>
  <polygon points="156,206 210,232 210,258 156,232 132,206 156,180" fill="#0f4c21"/>
  <polygon points="302,206 356,232 356,258 302,284 302,258 302,232" fill="#0f4c21"/>
  <!-- Shell lower hex tiles -->
  <polygon points="256,284 302,258 302,310 256,336 210,310 210,258" fill="#15803d" stroke="#14532d" stroke-width="2" opacity="0.7"/>
  <polygon points="166,234 210,258 210,310 166,286 142,258 166,234" fill="#15803d" stroke="#14532d" stroke-width="2" opacity="0.5"/>
  <polygon points="346,234 302,258 302,310 346,286 370,258 346,234" fill="#15803d" stroke="#14532d" stroke-width="2" opacity="0.5"/>

  <!-- Body (lower belly) -->
  <ellipse cx="256" cy="320" rx="118" ry="68" fill="#a3e635"/>

  <!-- Head -->
  <ellipse cx="256" cy="152" rx="62" ry="54" fill="#a3e635"/>

  <!-- Eyes (sleeping — curved lines) -->
  <path d="M228 146 Q242 134 254 146" stroke="#15803d" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M258 146 Q272 134 284 146" stroke="#15803d" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="256" cy="162" rx="8" ry="5" fill="#86efac" opacity="0.6"/>

  <!-- Legs -->
  <ellipse cx="148" cy="338" rx="48" ry="26" fill="#a3e635" transform="rotate(-30 148 338)"/>
  <ellipse cx="364" cy="338" rx="48" ry="26" fill="#a3e635" transform="rotate(30 364 338)"/>
  <ellipse cx="172" cy="408" rx="44" ry="22" fill="#a3e635" transform="rotate(15 172 408)"/>
  <ellipse cx="340" cy="408" rx="44" ry="22" fill="#a3e635" transform="rotate(-15 340 408)"/>

  <!-- Tail -->
  <path d="M220 380 Q180 430 160 420" stroke="#a3e635" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Graduation cap (board) -->
  <rect x="196" y="98" width="120" height="20" rx="5" fill="#0f4c21"/>
  <polygon points="192,98 320,98 296,72 224,72" fill="#166534"/>
  <!-- Cap top flat -->
  <rect x="222" y="66" width="68" height="8" rx="2" fill="#0f4c21"/>

  <!-- Tassel -->
  <line x1="296" y1="84" x2="332" y2="116" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <circle cx="334" cy="120" r="10" fill="#fbbf24"/>
  <line x1="334" y1="130" x2="326" y2="152" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="334" y1="130" x2="334" y2="154" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="334" y1="130" x2="342" y2="152" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- ZZZ (sleeping) -->
  <text x="348" y="116" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="48" fill="#4ade80" opacity="0.9">z</text>
  <text x="372" y="90" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="36" fill="#4ade80" opacity="0.7">z</text>
  <text x="392" y="68" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="24" fill="#4ade80" opacity="0.5">z</text>

  <!-- KUETx text at bottom -->
  <text x="256" y="478" font-family="system-ui,sans-serif" font-weight="900" font-size="58" fill="#a3e635" text-anchor="middle" letter-spacing="-1">KUET<tspan fill="#4ade80">x</tspan></text>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
  </defs>
</svg>
