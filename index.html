    <!-- ── Pre-React app-shell skeleton ─────────────────────────────────────
         Fixes "blank/Loading… screen on refresh" — the previous plain-text
         gate (App.jsx) only showed AFTER React mounted and Firebase/auth
         resolved, which on a slow connection or cold cache could take a
         visible moment. This skeleton paints INSTANTLY (pure HTML/CSS,
         parsed before any JS runs), shaped like the real sidebar+topbar
         layout, so the very first thing anyone ever sees looks like "the
         app is already here" rather than a loading state. React's first
         real render replaces #root's innerHTML automatically (React always
         takes full ownership of its mount node on initial render), so this
         disappears the instant real content is ready — nothing here needs
         to manually remove it.
         Theme (light/dark/milky) is read synchronously from localStorage's
         kuetx_theme mirror (see src/store/store.js's store.set, which
         writes to both memoryCache and localStorage) so the skeleton's
         colors match whatever the person last chose, with zero flash. -->
    <style>
      #app-shell-skeleton {
        position: fixed; inset: 0; z-index: 9999;
        display: flex;
        background: var(--shell-bg, #f5f5f2);
      }
      #app-shell-skeleton .sk-sidebar {
        width: 192px; height: 100vh; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-right: 1px solid var(--shell-border, #e2e0db);
      }
      #app-shell-skeleton .sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #app-shell-skeleton .sk-topbar {
        height: 56px; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-bottom: 1px solid var(--shell-border, #e2e0db);
      }
      @media (max-width: 768px) {
        #app-shell-skeleton .sk-sidebar { display: none; }
      }
    </style>

    <!-- ── Cold-start splash (real-photo cinematic sequence) ────────────────
         Shown ONCE per browser session (sessionStorage flag below) on the
         very first cold load — NOT on every internal route change, and NOT
         on repeat visits within the same tab session, so it never gets in
         the way of someone who's already using the app. It sits ON TOP OF
         #app-shell-skeleton (higher z-index) and fades itself out after
         ~5.6s or as soon as React has mounted real content, whichever the
         person's device/network allows — it never blocks or delays the
         real app underneath; #app-shell-skeleton and React are both loading
         normally the whole time behind it.
         All three photos are local files under /public/splash/ (see
         STATIC_ASSETS in sw.js — they're precached there for offline use),
         graded/cropped/compressed ahead of time, no runtime image
         processing, no external requests. Respects prefers-reduced-motion
         by skipping straight to a static logo instead of the photo
         sequence. -->
    <style>
      #kx-splash {
        position: fixed; inset: 0; z-index: 10000;
        background: #0a0a0c;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.7s ease;
      }
      #kx-splash.kx-hide {
        opacity: 0;
        pointer-events: none;
      }
      #kx-splash .kx-scene {
        position: absolute; inset: 0;
        background-size: cover;
        background-repeat: no-repeat;
        opacity: 0;
        transform: scale(1.06);
        filter: brightness(0.92);
        transition: opacity 1.3s ease, transform 4.5s cubic-bezier(0.22,1,0.36,1), filter 1.8s ease;
      }
      #kx-splash .kx-scene.kx-active { opacity: 1; transform: scale(1); filter: brightness(1); }
      #kx-splash .kx-scene.kx-exit { opacity: 0; transition: opacity 1.2s ease; }
      #kx-scene1 { background-image: url('/splash/scene-1-gate.webp'); background-position: 78% 15%; transform-origin: 60% 30%; }
      #kx-scene2 { background-image: url('/splash/scene-2-statue.webp'); background-position: center 35%; transform-origin: 50% 40%; }
      #kx-scene3 { background-image: url('/splash/scene-3-sign.webp'); background-position: center 45%; transform-origin: 50% 45%; }

      #kx-gradeOverlay {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(8,12,22,0.42) 0%, rgba(8,12,22,0.16) 26%, rgba(8,12,22,0.12) 55%, rgba(5,9,9,0.55) 100%);
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      #kx-warmOverlay {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 60% 40% at 50% 60%, rgba(255,170,90,0.14) 0%, transparent 70%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 2s ease;
      }
      #kx-warmOverlay.kx-show { opacity: 1; }
      #kx-vignette {
        position: absolute; inset: 0;
        box-shadow: inset 0 0 120px 40px rgba(3,5,10,0.55);
        pointer-events: none;
      }
      #kx-caption {
        position: absolute; left: 16px; right: 16px; bottom: 12%;
        text-align: center;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #kx-caption.kx-show { opacity: 1; }
      #kx-caption span {
        color: rgba(255,255,255,0.75);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      }
      #kx-curtain {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 45%, #0f2818 0%, #0a1710 70%, #060d09 100%);
        opacity: 0;
        transition: opacity 1s ease;
      }
      #kx-curtain.kx-show { opacity: 1; }
      #kx-logoLayer {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px;
        opacity: 0;
        transform: scale(0.88);
        transition: opacity 0.9s ease 0.1s, transform 1s cubic-bezier(0.34,1.56,0.64,1) 0.1s;
      }
      #kx-logoLayer.kx-show { opacity: 1; transform: scale(1); }
      #kx-wordmark { font-weight: 800; font-size: 40px; letter-spacing: -0.02em; color: #f5f5f0; }
      #kx-wordmark span { color: #4ade80; font-weight: 900; }
      #kx-tagline {
        font-size: 12.5px; color: rgba(255,255,255,0.5);
        letter-spacing: 0.06em; text-transform: uppercase;
        opacity: 0; transition: opacity 0.9s ease 0.5s;
      }
      #kx-tagline.kx-show { opacity: 1; }
      #kx-dots { display: flex; gap: 6px; margin-top: 10px; opacity: 0; transition: opacity 0.6s ease 0.9s; }
      #kx-dots.kx-show { opacity: 1; }
      #kx-dots span {
        width: 5px; height: 5px; border-radius: 50%;
        background: #4ade80;
        animation: kx-pulse 1.2s ease-in-out infinite;
      }
      #kx-dots span:nth-child(2) { animation-delay: 0.15s; }
      #kx-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes kx-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      /* Static fallback: prefers-reduced-motion skips the photo sequence
         entirely and shows only the logo, faded in once, no motion. */
      @media (prefers-reduced-motion: reduce) {
        #kx-splash .kx-scene, #kx-warmOverlay, #kx-caption, #kx-curtain { display: none !important; }
        #kx-splash { background: #14532d; }
        #kx-logoLayer, #kx-tagline, #kx-dots { transition-duration: 0.01ms !important; }
      }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kuetx_theme');
          var themeId = raw ? JSON.parse(raw) : 'light';
          var palettes = {
            light: { bg: '#f5f5f2', surface: '#ffffff', border: '#e2e0db' },
            milky: { bg: '#faf6ef', surface: '#fff8f0', border: '#e5d9c8' },
            dark:  { bg: '#0a0a0c', surface: '#14141a', border: '#27272f' },
          };
          var p = palettes[themeId] || palettes.light;
          var root = document.documentElement;
          root.style.setProperty('--shell-bg', p.bg);
          root.style.setProperty('--shell-surface', p.surface);
          root.style.setProperty('--shell-border', p.border);
          if (themeId === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc) — skeleton just
          // falls back to its light-theme default colors above.
        }
      })();
    </script>

    <div id="root"><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">KUETx — The Digital Ecosystem for KUET</h1><div id="app-shell-skeleton"><div class="sk-sidebar"></div><div class="sk-main"><div class="sk-topbar"></div></div></div></div>

    <script>
      // Only paint the cinematic splash once per browser session — first
      // cold load of the tab. Every subsequent internal navigation or
      // refresh-within-session skips straight to #app-shell-skeleton like
      // before, so returning users are never slowed down by a sequence
      // they've already seen. sessionStorage (not localStorage) is
      // deliberate: a brand-new tab/session gets the splash again, but
      // reloading the SAME tab repeatedly during normal use does not.
      (function () {
        try {
          if (sessionStorage.getItem('kx_splash_shown')) return;
          sessionStorage.setItem('kx_splash_shown', '1');
        } catch (e) {
          // sessionStorage unavailable (private mode) — fall through and
          // show the splash anyway, just won't be remembered for next tab.
        }

        var el = document.createElement('div');
        el.id = 'kx-splash';
        el.innerHTML =
          '<div class="kx-scene" id="kx-scene1"></div>' +
          '<div class="kx-scene" id="kx-scene2"></div>' +
          '<div class="kx-scene" id="kx-scene3"></div>' +
          '<div id="kx-gradeOverlay"></div>' +
          '<div id="kx-warmOverlay"></div>' +
          '<div id="kx-vignette"></div>' +
          '<div id="kx-caption"><span id="kx-captionText">Khulna University of Engineering &amp; Technology</span></div>' +
          '<div id="kx-curtain"></div>' +
          '<div id="kx-logoLayer">' +
            '<img src="/icon-512.png" width="88" height="88" alt="" style="box-shadow:0 8px 28px rgba(0,0,0,0.35)" />' +
            '<div id="kx-wordmark">KUET<span>x</span></div>' +
            '<div id="kx-tagline">The digital ecosystem for KUET</div>' +
            '<div id="kx-dots"><span></span><span></span><span></span></div>' +
          '</div>';
        document.body.appendChild(el);

        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var scene1 = document.getElementById('kx-scene1');
        var scene2 = document.getElementById('kx-scene2');
        var scene3 = document.getElementById('kx-scene3');
        var warmOverlay = document.getElementById('kx-warmOverlay');
        var caption = document.getElementById('kx-caption');
        var captionText = document.getElementById('kx-captionText');
        var curtain = document.getElementById('kx-curtain');
        var logoLayer = document.getElementById('kx-logoLayer');
        var tagline = document.getElementById('kx-tagline');
        var dots = document.getElementById('kx-dots');

        function hideSplash() {
          el.classList.add('kx-hide');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 750);
        }

        if (reduceMotion) {
          // Static fallback: no photo sequence, logo appears once, short hold, done.
          logoLayer.classList.add('kx-show');
          tagline.classList.add('kx-show');
          dots.classList.add('kx-show');
          setTimeout(hideSplash, 1400);
          return;
        }

        requestAnimationFrame(function () {
          setTimeout(function () { scene1.classList.add('kx-active'); }, 30);
          setTimeout(function () { caption.classList.add('kx-show'); }, 500);
          setTimeout(function () { caption.classList.remove('kx-show'); }, 1900);

          setTimeout(function () { scene1.classList.add('kx-exit'); }, 2100);
          setTimeout(function () { scene2.classList.add('kx-active'); warmOverlay.classList.add('kx-show'); }, 2100);
          setTimeout(function () {
            captionText.textContent = 'A campus community, always connected';
            caption.classList.add('kx-show');
          }, 2700);
          setTimeout(function () { caption.classList.remove('kx-show'); }, 3900);

          setTimeout(function () { scene2.classList.add('kx-exit'); }, 4100);
          setTimeout(function () { scene3.classList.add('kx-active'); }, 4100);

          setTimeout(function () { curtain.classList.add('kx-show'); }, 5300);
          setTimeout(function () { logoLayer.classList.add('kx-show'); }, 5550);
          setTimeout(function () { tagline.classList.add('kx-show'); }, 5950);
          setTimeout(function () { dots.classList.add('kx-show'); }, 6150);

          // Hard cap: always resolve to the real app by ~7s even if the
          // browser is under load and timers drift — the splash must never
          // be able to strand someone indefinitely in front of it.
          setTimeout(hideSplash, 7000);
        });
      })();
    </script>

    <script>
      // BUGFIX (slow-start-after-deploy): sw.js intentionally never calls
      // self.skipWaiting() on its own — a freshly-installed SW used to sit
      // in "waiting" forever with nothing here ever telling it to
      // activate, so the OLD service worker kept serving the OLD cached
      // index.html/app-shell on every load after a real deploy. The first
      // sign anyone actually got that a new version existed was a stale
      // JS chunk 404'ing mid-session (new deploy = new hashed filenames),
      // caught reactively by ErrorBoundary.jsx's ChunkLoadError handler,
      // which then force-reloaded the page — i.e. the app rendered once
      // in a half-broken state, THEN reloaded a second time to actually
      // work. That's the "app takes a while to start after an update"
      // symptom: two full loads instead of one.
      //
      // Fix: the moment registration.waiting exists (a new SW is
      // installed and sitting idle) — whether it's already there at
      // register time, or shows up later via 'updatefound' — tell it to
      // skipWaiting immediately. controllerchange then fires exactly
      // once, and THAT is the only point this ever reloads: at most once,
      // right when the new SW actually takes control, never twice, and
      // never dependent on a chunk failing first. reloading flag guards
      // against a double controllerchange firing two reloads back to back.
      if ('serviceWorker' in navigator &&
          window.location.hostname !== 'localhost' &&
          window.location.hostname !== '127.0.0.1' &&
          window.location.hostname !== '::1') {
        let reloading = false;
        const activateWaiting = (reg) => {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        };

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          // BUGFIX (install button disappearing after an SW update): if a
          // beforeinstallprompt event is currently sitting captured in
          // React state (see useInstallPrompt.js), reloading right now
          // would throw it away — and Chrome doesn't reliably refire it
          // on the next load, so the Install button would just vanish
          // for good. Wait for the person to act on it (or dismiss it)
          // before taking the update; re-check on a short interval
          // instead of reloading blind.
          const tryReload = () => {
            if (window.__kxInstallPromptPending) {
              setTimeout(tryReload, 1000);
              return;
            }
            if (reloading) return;
            reloading = true;
            window.location.reload();
          };
          tryReload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Case 1: a new SW was already installed and waiting from a
            // PREVIOUS visit (e.g. tab was open when the deploy landed,
            // browser was closed before it could activate) — catch that
            // immediately on this fresh load instead of waiting for the
            // user to notice anything broken.
            activateWaiting(reg);

            // Case 2: a new SW starts installing THIS visit (deploy
            // happened while already on the page, or first-ever
            // registration on a slow connection) — as soon as it finishes
            // installing, activate it right away too.
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  activateWaiting(reg);
                }
              });
            });
          }).catch(() => {});
        });
      }
    </script>
