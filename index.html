    <!-- ── Pre-React app-shell skeleton ─────────────────────────────────────
         Fixes "blank/Loading… screen on refresh" — the previous plain-text
         gate (App.jsx) only showed AFTER React mounted and Firebase/auth
         resolved, which on a slow connection or cold cache could take a
         visible moment. This skeleton paints INSTANTLY (pure HTML/CSS,
         parsed before any JS runs), shaped like the real sidebar+topbar
         layout, so the very first thing anyone ever sees looks like "the
         app is already here" rather than a loading state. React's first
         real render replaces #root's innerHTML automatically (React always
         takes full ownership of its mount node on initial render), so this
         disappears the instant real content is ready — nothing here needs
         to manually remove it.
         Theme (light/dark/milky) is read synchronously from localStorage's
         kuetx_theme mirror (see src/store/store.js's store.set, which
         writes to both memoryCache and localStorage) so the skeleton's
         colors match whatever the person last chose, with zero flash. -->
    <style>
      #app-shell-skeleton {
        position: fixed; inset: 0; z-index: 9999;
        display: flex;
        background: var(--shell-bg, #f5f5f2);
      }
      #app-shell-skeleton .sk-sidebar {
        width: 192px; height: 100vh; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-right: 1px solid var(--shell-border, #e2e0db);
      }
      #app-shell-skeleton .sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #app-shell-skeleton .sk-topbar {
        height: 56px; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-bottom: 1px solid var(--shell-border, #e2e0db);
      }
      @media (max-width: 768px) {
        #app-shell-skeleton .sk-sidebar { display: none; }
      }
    </style>

    <!-- ── Cold-start splash (Logo-only, best-practice minimal) ──────────
         Trigger logic differs by launch context — see the full summary
         comment above the trigger script near the end of <body> for the
         per-context table. Short version: browser tab uses the old
         sessionStorage "once per tab" rule; an installed/standalone PWA
         shows it on every cold launch instead (that's the moment users
         expect a native-style splash), but is skipped on a
         background→foreground resume since nothing was ever torn down.
         Sits ON TOP OF #app-shell-skeleton (higher z-index) and fades
         itself out at the end, handing off to the real app underneath.

         Design rationale: researched current splash-screen guidance
         (Apple HIG, Android 12+ Splash Screen API, and general mobile UX
         consensus) — the converging advice is: brand-color background +
         logo only, no tagline/text, minimal or no animation, and total
         display time under ~1.5s (long splashes measurably hurt
         retention; Android's own API targets 500–1500ms). So this is cut
         down to just that: a solid background color chosen to complement
         the mascot art (deep forest green, a darker shade of the KUETx
         brand green #16a34a, picked so the mascot's white/cream outline
         and pillow read clearly against it) and the mascot fading in —
         no wordmark, no typewriter, no tagline, no photos. -->
    <style>
      #kx-splash {
        position: fixed; inset: 0; z-index: 10000;
        background: #faf6ee;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #kx-splash.kx-hide {
        opacity: 0;
        pointer-events: none;
      }

      /* Card wrapper gives us 3D space to flip within; the logo itself
         never distorts because each face is a flat, un-rotated element —
         only the wrapper rotates on Y, so mascot artwork never looks
         skewed or stretched mid-flip. */
      #kx-cardWrap {
        opacity: 0;
        transform: scale(0.94);
        transition: opacity 0.4s ease, transform 0.4s ease;
        perspective: 900px;
        -webkit-perspective: 900px;
      }
      #kx-cardWrap.kx-show {
        opacity: 1;
        transform: scale(1);
      }

      #kx-card {
        position: relative;
        width: 220px; height: 220px;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        transition: transform 0.7s cubic-bezier(.65,.05,.36,1);
      }
      @media screen and (min-width: 641px) {
        #kx-card { width: 300px; height: 300px; }
      }
      @media screen and (min-width: 1024px) {
        #kx-card { width: 360px; height: 360px; }
      }
      @media screen and (min-width: 1600px) {
        #kx-card { width: 420px; height: 420px; }
      }
      @media screen and (max-width: 640px) {
        #kx-card { width: 44vw; height: 44vw; max-width: 220px; max-height: 220px; }
      }

      #kx-card.kx-flip {
        transform: rotateY(360deg);
      }

      #kx-face, #kx-faceBack {
        position: absolute; inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      #kx-face img, #kx-faceBack img {
        width: 100%; height: 100%;
        display: block;
        filter: drop-shadow(0 8px 24px rgba(20,50,30,0.18));
      }
      /* Back face is rotated 180deg in the DOM so that when the wrapper
         hits the halfway point of its own 360deg spin, this is what's
         facing the viewer — same mascot artwork, not a separate mark, so
         the flip reads as "the logo itself turning" rather than
         revealing a different logo underneath. backface-visibility keeps
         whichever face is pointed away from the viewer invisible, so
         there's never a double-image or a see-through moment. */
      #kx-faceBack {
        transform: rotateY(180deg);
      }

      #kx-wordmark {
        margin-top: 22px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.4s ease, transform 0.4s ease;
        display: flex; align-items: baseline; justify-content: center;
        font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
      }
      #kx-wordmark.kx-show {
        opacity: 1;
        transform: translateY(0);
      }
      #kx-wordmark .kx-word {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #14532d;
      }
      #kx-wordmark .kx-dots {
        display: inline-flex;
        margin-left: 2px;
      }
      #kx-wordmark .kx-dots span {
        opacity: 0;
        font-size: 22px;
        font-weight: 700;
        color: #14532d;
        animation: kx-dot-pulse 1.2s ease-in-out infinite;
      }
      #kx-wordmark .kx-dots span:nth-child(1) { animation-delay: 0s; }
      #kx-wordmark .kx-dots span:nth-child(2) { animation-delay: 0.25s; }
      #kx-wordmark .kx-dots span:nth-child(3) { animation-delay: 0.5s; }
      #kx-wordmark .kx-dots span:nth-child(4) { animation-delay: 0.75s; }
      @keyframes kx-dot-pulse {
        0%   { opacity: 0; }
        20%  { opacity: 1; }
        60%  { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Static fallback: prefers-reduced-motion skips the fade, the flip,
         and the dot animation — mascot and wordmark are simply visible
         immediately, no rotation, no pulsing. */
      @media (prefers-reduced-motion: reduce) {
        #kx-cardWrap { transition-duration: 0.01ms !important; transform: scale(1) !important; }
        #kx-card { transition: none !important; }
        #kx-wordmark { transition-duration: 0.01ms !important; transform: translateY(0) !important; }
        #kx-wordmark .kx-dots span { animation: none !important; opacity: 1 !important; }
      }
    </style>
    <script>
      (function () {

          root.style.setProperty('--shell-bg', p.bg);

          root.style.setProperty('--shell-border', p.border);
          if (themeId === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc) — skeleton just
          // falls back to its light-theme default colors above.
        }
      })();
    </script>

    <div id="root"><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">KUETx — The Digital Ecosystem for KUET</h1><div id="app-shell-skeleton"><div class="sk-sidebar"></div><div class="sk-main"><div class="sk-topbar"></div></div></div></div>

    <script>
      // ── Splash trigger logic — context summary (researched 2026) ──────
      // Browser tab, first visit ever              → SHOW
      // Browser tab, same-session refresh/reload    → SKIP (sessionStorage)
      // Browser tab, brand-new tab (even same site)  → SHOW (sessionStorage
      //   is per-tab, never shared across tabs, so this already works)
      // Installed PWA, cold launch (icon tap after   → SHOW, but SKIP-
      //   full close, or first launch)                 REMEMBER nothing —
      //                                                 every cold launch
      //                                                 re-shows it
      // Installed PWA, backgrounded → foregrounded   → SKIP (page was never
      //   (app switcher, screen lock, etc.)             torn down; a
      //                                                  'visibilitychange'
      //                                                  never re-runs this
      //                                                  script at all, so
      //                                                  no special-casing
      //                                                  is needed here —
      //                                                  this script only
      //                                                  runs once per real
      //                                                  page load/parse)
      //
      // Why standalone gets its own branch instead of sessionStorage:
      // Chrome/Android already paints its OWN native splash (icon +
      // background_color from manifest.json) the instant the icon is
      // tapped, BEFORE this HTML/JS can run at all — so our splash is
      // always the second, stacked screen for installed users, never the
      // first impression. iOS is different: Safari's static Launch Screen
      // Image is shown per-launch with no animation, and — critically —
      // sessionStorage does NOT reliably survive a full close+reopen of an
      // installed PWA the way it does a backgrounded tab, so treating
      // installed mode with the tab's "once per session" rule would
      // actually show the splash on unpredictable installed opens instead
      // of consistently. Showing it every cold launch (kept short, ~1.3s)
      // matches what users expect from a native app's launch animation and
      // reads as consistent rather than as a bug. detection uses
      // display-mode: standalone as the primary signal (covers Chrome/
      // Edge/most installed contexts in 2026) with navigator.standalone as
      // a fallback specifically for older iOS Safari, which never adopted
      // display-mode media queries for its home-screen web apps.
      (function () {
        var isStandalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;

        if (!isStandalone) {
          // Regular browser tab: keep the original "once per tab session"
          // behavior — sessionStorage (not localStorage) is deliberate, a
          // brand-new tab/session gets the splash again, but reloading the
          // SAME tab repeatedly during normal use does not.
          try {
            if (sessionStorage.getItem('kx_splash_shown')) return;
            sessionStorage.setItem('kx_splash_shown', '1');
          } catch (e) {
            // sessionStorage unavailable (private mode) — fall through and
            // show the splash anyway, just won't be remembered for next tab.
          }
        }
        // else: installed/standalone PWA — intentionally no storage check,
        // every cold launch (this script only runs on an actual page
        // parse, never on a background/foreground resume) shows the splash.

        var el = document.createElement('div');
        el.id = 'kx-splash';
        el.innerHTML =
          '<div id="kx-cardWrap">' +
            '<div id="kx-card">' +
              '<div id="kx-face" class="kx-face-front">' +
                '<img src="/splash/mascot.webp" width="260" height="260" alt="" />' +
              '</div>' +
              '<div id="kx-faceBack">' +
                '<img src="/splash/mascot.webp" width="260" height="260" alt="" />' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div id="kx-wordmark">' +
            '<span class="kx-word">KUETx</span>' +
            '<span class="kx-dots"><span>.</span><span>.</span><span>.</span><span>.</span></span>' +
          '</div>';
        document.body.appendChild(el);

        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var cardWrap = document.getElementById('kx-cardWrap');
        var card = document.getElementById('kx-card');
        var wordmark = document.getElementById('kx-wordmark');

        function hideSplash() {
          el.classList.add('kx-hide');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 400);
        }

        if (reduceMotion) {
          // Static fallback: mascot + wordmark simply visible, brief
          // hold, done — no flip, no dot pulsing (see the
          // prefers-reduced-motion block in the stylesheet above).
          cardWrap.classList.add('kx-show');
          wordmark.classList.add('kx-show');
          setTimeout(hideSplash, 900);
          return;
        }

        // Timeline (~5s total): logo fades/scales in, wordmark + loading
        // dots fade in right after, then partway through the hold the
        // card does one full coin-flip (front mascot → back mark →
        // front mascot again) so it settles back facing forward well
        // before the splash fades out — the flip is a "still working"
        // beat, not the exit motion. Total is intentionally longer than
        // the old ~1.3s minimal version per explicit request, capped at
        // 5s so it never reads as stuck.
        var ENTER_DELAY = 30;
        var WORDMARK_DELAY = 350;
        var FLIP_START = 1600;   // when the coin-flip begins
        var FADE_START = 4600;   // when the whole splash starts fading out
        var TOTAL_DURATION = 5000;

        requestAnimationFrame(function () {
          setTimeout(function () {
            cardWrap.classList.add('kx-show');
          }, ENTER_DELAY);

          setTimeout(function () {
            wordmark.classList.add('kx-show');
          }, WORDMARK_DELAY);

          setTimeout(function () {
            card.classList.add('kx-flip');
          }, FLIP_START);

          setTimeout(function () {
            el.style.opacity = 0;
          }, FADE_START);

          setTimeout(hideSplash, TOTAL_DURATION + 300);
        });
      })();
    </script>

    <script>
      // BUGFIX (slow-start-after-deploy): sw.js intentionally never calls
      // self.skipWaiting() on its own — a freshly-installed SW used to sit
      // in "waiting" forever with nothing here ever telling it to
      // activate, so the OLD service worker kept serving the OLD cached
      // index.html/app-shell on every load after a real deploy. The first
      // sign anyone actually got that a new version existed was a stale
      // JS chunk 404'ing mid-session (new deploy = new hashed filenames),
      // caught reactively by ErrorBoundary.jsx's ChunkLoadError handler,
      // which then force-reloaded the page — i.e. the app rendered once
      // in a half-broken state, THEN reloaded a second time to actually
      // work. That's the "app takes a while to start after an update"
      // symptom: two full loads instead of one.
      //
      // Fix: the moment registration.waiting exists (a new SW is
      // installed and sitting idle) — whether it's already there at
      // register time, or shows up later via 'updatefound' — tell it to
      // skipWaiting immediately. controllerchange then fires exactly
      // once, and THAT is the only point this ever reloads: at most once,
      // right when the new SW actually takes control, never twice, and
      // never dependent on a chunk failing first. reloading flag guards
      // against a double controllerchange firing two reloads back to back.
      if ('serviceWorker' in navigator &&
          window.location.hostname !== 'localhost' &&
          window.location.hostname !== '127.0.0.1' &&
          window.location.hostname !== '::1') {
        let reloading = false;
        const activateWaiting = (reg) => {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        };

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          // BUGFIX (install button disappearing after an SW update): if a
          // beforeinstallprompt event is currently sitting captured in
          // React state (see useInstallPrompt.js), reloading right now
          // would throw it away — and Chrome doesn't reliably refire it
          // on the next load, so the Install button would just vanish
          // for good. Wait for the person to act on it (or dismiss it)
          // before taking the update; re-check on a short interval
          // instead of reloading blind.
          const tryReload = () => {
            if (window.__kxInstallPromptPending) {
              setTimeout(tryReload, 1000);
              return;
            }
            if (reloading) return;
            reloading = true;
            window.location.reload();
          };
          tryReload();
        });

        // BUGFIX/perf (install prompt taking longer than necessary to
        // become eligible): registration used to be gated behind the
        // window 'load' event, which only fires after every image, font,
        // and script on the page has finished — on a slower connection
        // that can be several seconds. Chrome's own "has this page had a
        // working, controlling service worker for a little while" signal
        // (part of its install-eligibility engagement check — see
        // useInstallPrompt.js's header comment on why this can't be
        // skipped outright) only starts counting once registration
        // actually happens, so registering as soon as the browser
        // supports it — not waiting for 'load' — gives that clock the
        // earliest possible start. Doesn't change what Chrome requires,
        // only removes an unnecessary delay from our side of it.
        const registerNow = () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Case 1: a new SW was already installed and waiting from a
            // PREVIOUS visit (e.g. tab was open when the deploy landed,
            // browser was closed before it could activate) — catch that
            // immediately on this fresh load instead of waiting for the
            // user to notice anything broken.
            activateWaiting(reg);

            // Case 2: a new SW starts installing THIS visit (deploy
            // happened while already on the page, or first-ever
            // registration on a slow connection) — as soon as it finishes
            // installing, activate it right away too.
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  activateWaiting(reg);
                }
              });
            });
          }).catch(() => {});
        };

        if (document.readyState === 'complete') {
          registerNow();
        } else {
          window.addEventListener('load', registerNow);
        }
      }
    </script>
