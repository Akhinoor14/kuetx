    <!-- ── Pre-React app-shell skeleton ─────────────────────────────────────
         Fixes "blank/Loading… screen on refresh" — the previous plain-text
         gate (App.jsx) only showed AFTER React mounted and Firebase/auth
         resolved, which on a slow connection or cold cache could take a
         visible moment. This skeleton paints INSTANTLY (pure HTML/CSS,
         parsed before any JS runs), shaped like the real sidebar+topbar
         layout, so the very first thing anyone ever sees looks like "the
         app is already here" rather than a loading state. React's first
         real render replaces #root's innerHTML automatically (React always
         takes full ownership of its mount node on initial render), so this
         disappears the instant real content is ready — nothing here needs
         to manually remove it.
         Theme (light/dark/milky) is read synchronously from localStorage's
         kuetx_theme mirror (see src/store/store.js's store.set, which
         writes to both memoryCache and localStorage) so the skeleton's
         colors match whatever the person last chose, with zero flash. -->
    <style>
      #app-shell-skeleton {
        position: fixed; inset: 0; z-index: 9999;
        display: flex;
        background: var(--shell-bg, #f5f5f2);
      }
      #app-shell-skeleton .sk-sidebar {
        width: 192px; height: 100vh; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-right: 1px solid var(--shell-border, #e2e0db);
      }
      #app-shell-skeleton .sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #app-shell-skeleton .sk-topbar {
        height: 56px; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-bottom: 1px solid var(--shell-border, #e2e0db);
      }
      @media (max-width: 768px) {
        #app-shell-skeleton .sk-sidebar { display: none; }
      }
    </style>

    <!-- ── Cold-start splash (Minimal Badge Zoom) ───────────────────────
         Shown ONCE per browser session (sessionStorage flag below) on the
         very first cold load — NOT on every internal route change, and NOT
         on repeat visits within the same tab session, so it never gets in
         the way of someone who's already using the app. It sits ON TOP OF
         #app-shell-skeleton (higher z-index) and fades itself out at the
         end of the sequence, handing off to the real app underneath;
         #app-shell-skeleton and React are both loading normally the whole
         time behind it.

         Design: two independent layers that can never collide —
           1) a full-bleed background layer of 4 campus photos, each
              Ken-Burns zooming + crossfading into the next
           2) a small, sharp, ALWAYS-CENTERED badge (mascot + wordmark +
              tagline + clock) on a translucent glass pill, floating above
         Since the badge's position never depends on where the photos are
         and vice-versa, there is no overlap math to get wrong on any
         screen size — this replaces the previous "cards orbit around a
         fixed logo" design, which needed per-breakpoint offset tuning.
         All four photos are local files under /public/splash/ (see
         STATIC_ASSETS in sw.js — precached there for offline use),
         pre-compressed ahead of time, no runtime image processing, no
         external requests. Respects prefers-reduced-motion by skipping
         straight to a static badge instead of the photo sequence. -->
    <style>
      #kx-splash {
        position: fixed; inset: 0; z-index: 10000;
        background: #081a10;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #kx-splash.kx-hide {
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- Background photo layer ---------- */
      #kx-photoLayer { position: absolute; inset: 0; z-index: 1; }
      .kx-photo {
        position: absolute; inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transform: scale(1);
        transition: opacity 0.7s ease;
        will-change: opacity, transform;
      }
      .kx-photo.kx-photo-active {
        opacity: 1;
        animation: kx-kenburns 1.6s ease-out forwards;
      }
      @keyframes kx-kenburns {
        from { transform: scale(1); }
        to   { transform: scale(1.08); }
      }
      #kx-overlay {
        position: absolute; inset: 0; z-index: 1;
        background: rgba(8, 26, 16, 0.55);
        pointer-events: none;
      }

      /* ---------- Foreground badge — always centered, own layer ---------- */
      #kx-centerLogo {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        gap: 0;
        padding: 28px 24px;
        border-radius: 20px;
        background: rgba(12, 39, 24, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        opacity: 0;
        z-index: 2;
        transition: opacity 0.5s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
      }
      #kx-centerLogo.kx-show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      #kx-centerLogo.kx-hide-badge {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      #kx-centerLogo img {
        width: 56px; height: 56px;
        display: block;
      }
      #kx-wordmark {
        font-weight: 800; font-size: 1.3rem; letter-spacing: -0.01em;
        color: #f5f5f0; margin-top: 10px;
      }
      #kx-wordmark span { color: #4ade80; font-weight: 900; }
      #kx-tagline {
        font-size: 0.75rem; color: rgba(255,255,255,0.75);
        margin-top: 4px;
      }
      #kx-clock {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.85rem; font-weight: 600; letter-spacing: 0.03em;
        color: #a5d6a7;
        margin-top: 10px;
        display: flex; align-items: center; gap: 7px;
      }
      #kx-clock .kx-clock-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #4ade80; flex-shrink: 0;
        box-shadow: 0 0 6px rgba(74,222,128,0.8);
      }

      @media screen and (min-width: 641px) {
        #kx-centerLogo { width: 360px; padding: 36px 32px; }
        #kx-centerLogo img { width: 72px; height: 72px; }
        #kx-wordmark { font-size: 1.6rem; }
        #kx-tagline { font-size: 0.85rem; }
        #kx-clock { font-size: 0.95rem; }
      }
      @media screen and (max-width: 640px) {
        #kx-centerLogo { width: 78vw; max-width: 320px; }
      }

      /* Static fallback: prefers-reduced-motion skips photo animation
         entirely and shows only the badge, faded in once, no motion. */
      @media (prefers-reduced-motion: reduce) {
        #kx-photoLayer, #kx-overlay { display: none !important; }
        #kx-splash { background: #14532d; }
        .kx-photo { animation: none !important; transition: none !important; }
        #kx-centerLogo { transition-duration: 0.01ms !important; }
      }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kuetx_theme');
          var themeId = raw ? JSON.parse(raw) : 'light';
          var palettes = {
            light: { bg: '#f5f5f2', surface: '#ffffff', border: '#e2e0db' },
            milky: { bg: '#faf6ef', surface: '#fff8f0', border: '#e5d9c8' },
            dark:  { bg: '#0a0a0c', surface: '#14141a', border: '#27272f' },
          };
          var p = palettes[themeId] || palettes.light;
          var root = document.documentElement;
          root.style.setProperty('--shell-bg', p.bg);
          root.style.setProperty('--shell-surface', p.surface);
          root.style.setProperty('--shell-border', p.border);
          if (themeId === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc) — skeleton just
          // falls back to its light-theme default colors above.
        }
      })();
    </script>

  <body>
    <div id="root"><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">KUETx — The Digital Ecosystem for KUET</h1><div id="app-shell-skeleton"><div class="sk-sidebar"></div><div class="sk-main"><div class="sk-topbar"></div></div></div></div>

    <script>
      // Only paint the "Minimal Badge Zoom" splash once per browser session —
      // first cold load of the tab. Every subsequent internal navigation or
      // refresh-within-session skips straight to #app-shell-skeleton like
      // before, so returning users are never slowed down by a sequence
      // they've already seen. sessionStorage (not localStorage) is
      // deliberate: a brand-new tab/session gets the splash again, but
      // reloading the SAME tab repeatedly during normal use does not.
      (function () {
        try {
          if (sessionStorage.getItem('kx_splash_shown')) return;
          sessionStorage.setItem('kx_splash_shown', '1');
        } catch (e) {
          // sessionStorage unavailable (private mode) — fall through and
          // show the splash anyway, just won't be remembered for next tab.
        }

        // Four background photos, crossfading in this order.
        var PHOTOS = [
          { src: '/splash/gate.webp',     alt: 'KUET main gate' },
          { src: '/splash/academic.webp', alt: 'KUET academic building' },
          { src: '/splash/aerial.webp',   alt: 'Aerial view of KUET campus' },
          { src: '/splash/sign.webp',     alt: 'KUET sign at dusk' },
        ];

        var el = document.createElement('div');
        el.id = 'kx-splash';
        el.innerHTML =
          '<div id="kx-photoLayer">' +
            PHOTOS.map(function (p, i) {
              return '<div class="kx-photo' + (i === 0 ? ' kx-photo-active' : '') + '" id="kx-photo' + i + '" ' +
                     'role="img" aria-label="' + p.alt + '" style="background-image:url(\'' + p.src + '\')"></div>';
            }).join('') +
          '</div>' +
          '<div id="kx-overlay"></div>' +
          '<div id="kx-centerLogo">' +
            '<img src="/splash/mascot.webp" width="72" height="72" alt="" />' +
            '<div id="kx-wordmark">KUET<span>x</span></div>' +
            '<div id="kx-tagline">The digital ecosystem for KUET</div>' +
            '<div id="kx-clock"><span class="kx-clock-dot"></span><span id="kx-clock-text"></span></div>' +
          '</div>';
        document.body.appendChild(el);

        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var centerLogo = document.getElementById('kx-centerLogo');
        var clockText = document.getElementById('kx-clock-text');
        var photoEls = PHOTOS.map(function (_, i) { return document.getElementById('kx-photo' + i); });

        // Live clock — ticks for as long as the splash is on screen.
        var clockTimer = null;
        function renderClock() {
          try {
            clockText.textContent = new Date().toLocaleTimeString([], {
              hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true,
            });
          } catch (e) { /* Intl unavailable — just skip a tick */ }
        }

        function hideSplash() {
          el.classList.add('kx-hide');
          if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 400);
        }

        if (reduceMotion) {
          // Static fallback: no photo motion, badge appears once, short hold, done.
          centerLogo.classList.add('kx-show');
          renderClock();
          clockTimer = setInterval(renderClock, 1000);
          setTimeout(hideSplash, 1400);
          return;
        }

        // Timeline (7s total):
        //   0ms    first photo visible, Ken Burns zoom begins
        //   200ms  badge fades/scales in
        //   700ms  badge settled, clock starts ticking
        //   1600ms / 3200ms / 4800ms  photo crossfades (4 photos total)
        //   6400ms badge starts fade+scale out
        //   6700ms splash background starts fading, revealing app
        //   7000ms splash removed from DOM
        var PHOTO_INTERVAL = 1600;
        var TOTAL_DURATION = 7000;
        var BADGE_ENTER_DELAY = 200;
        var BADGE_EXIT_LEAD = 600;
        var OVERLAY_FADE_LEAD = 300;

        requestAnimationFrame(function () {
          setTimeout(function () {
            centerLogo.classList.add('kx-show');
          }, BADGE_ENTER_DELAY);

          setTimeout(function () {
            renderClock();
            clockTimer = setInterval(renderClock, 1000);
          }, BADGE_ENTER_DELAY + 500);

          photoEls.forEach(function (photo, i) {
            if (i === 0) return; // first photo already active
            setTimeout(function () {
              photoEls.forEach(function (p) { p.classList.remove('kx-photo-active'); });
              void photo.offsetWidth; // restart the Ken Burns animation cleanly
              photo.classList.add('kx-photo-active');
            }, i * PHOTO_INTERVAL);
          });

          setTimeout(function () {
            centerLogo.classList.remove('kx-show');
            centerLogo.classList.add('kx-hide-badge');
          }, TOTAL_DURATION - BADGE_EXIT_LEAD);

          setTimeout(function () {
            el.style.opacity = 0;
          }, TOTAL_DURATION - OVERLAY_FADE_LEAD);

          setTimeout(hideSplash, TOTAL_DURATION + 200);
        });
      })();
    </script>

    <script>
      // BUGFIX (slow-start-after-deploy): sw.js intentionally never calls
      // self.skipWaiting() on its own — a freshly-installed SW used to sit
      // in "waiting" forever with nothing here ever telling it to
      // activate, so the OLD service worker kept serving the OLD cached
      // index.html/app-shell on every load after a real deploy. The first
      // sign anyone actually got that a new version existed was a stale
      // JS chunk 404'ing mid-session (new deploy = new hashed filenames),
      // caught reactively by ErrorBoundary.jsx's ChunkLoadError handler,
      // which then force-reloaded the page — i.e. the app rendered once
      // in a half-broken state, THEN reloaded a second time to actually
      // work. That's the "app takes a while to start after an update"
      // symptom: two full loads instead of one.
      //
      // Fix: the moment registration.waiting exists (a new SW is
      // installed and sitting idle) — whether it's already there at
      // register time, or shows up later via 'updatefound' — tell it to
      // skipWaiting immediately. controllerchange then fires exactly
      // once, and THAT is the only point this ever reloads: at most once,
      // right when the new SW actually takes control, never twice, and
      // never dependent on a chunk failing first. reloading flag guards
      // against a double controllerchange firing two reloads back to back.
      if ('serviceWorker' in navigator &&
          window.location.hostname !== 'localhost' &&
          window.location.hostname !== '127.0.0.1' &&
          window.location.hostname !== '::1') {
        let reloading = false;
        const activateWaiting = (reg) => {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        };

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          // BUGFIX (install button disappearing after an SW update): if a
          // beforeinstallprompt event is currently sitting captured in
          // React state (see useInstallPrompt.js), reloading right now
          // would throw it away — and Chrome doesn't reliably refire it
          // on the next load, so the Install button would just vanish
          // for good. Wait for the person to act on it (or dismiss it)
          // before taking the update; re-check on a short interval
          // instead of reloading blind.
          const tryReload = () => {
            if (window.__kxInstallPromptPending) {
              setTimeout(tryReload, 1000);
              return;
            }
            if (reloading) return;
            reloading = true;
            window.location.reload();
          };
          tryReload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Case 1: a new SW was already installed and waiting from a
            // PREVIOUS visit (e.g. tab was open when the deploy landed,
            // browser was closed before it could activate) — catch that
            // immediately on this fresh load instead of waiting for the
            // user to notice anything broken.
            activateWaiting(reg);

            // Case 2: a new SW starts installing THIS visit (deploy
            // happened while already on the page, or first-ever
            // registration on a slow connection) — as soon as it finishes
            // installing, activate it right away too.
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  activateWaiting(reg);
                }
              });
            });
          }).catch(() => {});
        });
      }
    </script>
