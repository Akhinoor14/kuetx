    <!-- ── Pre-React app-shell skeleton ─────────────────────────────────────
         Fixes "blank/Loading… screen on refresh" — the previous plain-text
         gate (App.jsx) only showed AFTER React mounted and Firebase/auth
         resolved, which on a slow connection or cold cache could take a
         visible moment. This skeleton paints INSTANTLY (pure HTML/CSS,
         parsed before any JS runs), shaped like the real sidebar+topbar
         layout, so the very first thing anyone ever sees looks like "the
         app is already here" rather than a loading state. React's first
         real render replaces #root's innerHTML automatically (React always
         takes full ownership of its mount node on initial render), so this
         disappears the instant real content is ready — nothing here needs
         to manually remove it.
         Theme (light/dark/milky) is read synchronously from localStorage's
         kuetx_theme mirror (see src/store/store.js's store.set, which
         writes to both memoryCache and localStorage) so the skeleton's
         colors match whatever the person last chose, with zero flash. -->
    <style>
      #app-shell-skeleton {
        position: fixed; inset: 0; z-index: 9999;
        display: flex;
        background: var(--shell-bg, #f5f5f2);
      }
      #app-shell-skeleton .sk-sidebar {
        width: 192px; height: 100vh; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-right: 1px solid var(--shell-border, #e2e0db);
      }
      #app-shell-skeleton .sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #app-shell-skeleton .sk-topbar {
        height: 56px; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-bottom: 1px solid var(--shell-border, #e2e0db);
      }
      @media (max-width: 768px) {
        #app-shell-skeleton .sk-sidebar { display: none; }
      }
    </style>

    <!-- ── Cold-start splash (Minimal Badge Zoom) ───────────────────────
         Shown ONCE per browser session (sessionStorage flag below) on the
         very first cold load — NOT on every internal route change, and NOT
         on repeat visits within the same tab session, so it never gets in
         the way of someone who's already using the app. It sits ON TOP OF
         #app-shell-skeleton (higher z-index) and fades itself out at the
         end of the sequence, handing off to the real app underneath;
         #app-shell-skeleton and React are both loading normally the whole
         time behind it.

         Design: two independent layers that can never collide —
           1) a full-bleed background layer of 4 campus photos, each
              Ken-Burns zooming + crossfading into the next
           2) a small, sharp, ALWAYS-CENTERED badge (mascot + wordmark +
              tagline + clock) on a translucent glass pill, floating above
         Since the badge's position never depends on where the photos are
         and vice-versa, there is no overlap math to get wrong on any
         screen size — this replaces the previous "cards orbit around a
         fixed logo" design, which needed per-breakpoint offset tuning.
         All four photos are local files under /public/splash/ (see
         STATIC_ASSETS in sw.js — precached there for offline use),
         pre-compressed ahead of time, no runtime image processing, no
         external requests. Respects prefers-reduced-motion by skipping
         straight to a static badge instead of the photo sequence. -->
    <style>
      #kx-splash {
        position: fixed; inset: 0; z-index: 10000;
        background: #081a10;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #kx-splash.kx-hide {
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- Background photo layer: 4 quadrants ----------
         Each quadrant photo starts pushed off-canvas (translated past
         its own screen edge) at full-viewport size, slides+scales in
         to together cover the whole screen (no gap, no crop of the
         subject — background-size:cover on a full-viewport box shows
         as much of each photo as any single full-bleed splash image
         would), holds fully assembled for a beat, then all four
         shrink in place toward their own corner, opening a diamond-
         shaped gap in the middle for the badge. Percentage-based
         translate/size keeps this proportionally identical on mobile
         portrait and desktop widescreen alike. */
      #kx-photoLayer { position: absolute; inset: 0; z-index: 1; }
      .kx-photo {
        position: absolute;
        width: 100vw; height: 100vh;
        background-size: cover;
        background-position: center;
        transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1), width 1s cubic-bezier(0.65, 0, 0.35, 1), height 1s cubic-bezier(0.65, 0, 0.35, 1), top 1s cubic-bezier(0.65, 0, 0.35, 1), left 1s cubic-bezier(0.65, 0, 0.35, 1);
        will-change: transform, width, height;
      }
      /* BUGFIX (photos invisible on load): translate(±100%, ±100%) here
         resolves against THIS element's own box — and each quadrant starts
         at full-viewport size (100vw/100vh, see .kx-photo above) before its
         first transition ever runs. So translate(-100%, -100%) shifted a
         100vw-wide box a further 100vw to the left — a full extra screen
         away, not just off the near edge — landing it (and the other three
         quadrants, symmetrically) so far outside the viewport that they
         never became visible at any point in the transition. Fixed by
         moving the off-canvas placement into top/left (viewport-relative,
         not self-relative) so each quadrant starts exactly one viewport-
         width/height past its own edge — close enough to slide fully into
         view — and dropping the transform entirely for the initial state. */
      #kx-photoTL { top: -100vh; left: -100vw; }
      #kx-photoTR { top: -100vh; left: 150vw; }
      #kx-photoBL { top: 150vh;  left: -100vw; }
      #kx-photoBR { top: 150vh;  left: 150vw; }

      /* Step 1: slide fully into place, each quadrant at exactly
         quarter-viewport size positioned edge-to-edge — together they
         tile the whole screen seamlessly, no gap, no overlap. Explicit
         top/left per quadrant (not translate(0,0)) since the off-canvas
         start state above is now expressed in top/left, not transform. */
      #kx-photoTL.kx-arrived { top: 0;   left: 0;   width: 50vw; height: 50vh; }
      #kx-photoTR.kx-arrived { top: 0;   left: 50vw; width: 50vw; height: 50vh; }
      #kx-photoBL.kx-arrived { top: 50vh; left: 0;   width: 50vw; height: 50vh; }
      #kx-photoBR.kx-arrived { top: 50vh; left: 50vw; width: 50vw; height: 50vh; }

      /* Step 2: shrink each quadrant toward its own corner, same
         transition timing, opening the center gap for the badge. The
         percentage shrink (not px) is what keeps this identical on
         any screen size — see kx-shrunk sizing below. */
      .kx-photo.kx-shrunk {
        width: 42vw; height: 42vh;
      }
      #kx-photoTR.kx-shrunk { left: 58vw; }
      #kx-photoBL.kx-shrunk { top: 58vh; }
      #kx-photoBR.kx-shrunk { top: 58vh; left: 58vw; }

      #kx-overlay {
        position: absolute; inset: 0; z-index: 1;
        background: rgba(8, 26, 16, 0.35);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #kx-overlay.kx-show { opacity: 1; }

      /* ---------- Foreground mascot — always centered, own layer ----------
         Just the transparent mascot art + wordmark, no card/background,
         no tagline, no clock. Big and unmissable. */
      #kx-centerLogo {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        gap: 0;
        opacity: 0;
        z-index: 2;
        transition: opacity 0.5s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
      }
      #kx-centerLogo.kx-show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      #kx-centerLogo.kx-hide-badge {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      #kx-centerLogo img {
        width: 200px; height: 200px;
        display: block;
        filter: drop-shadow(0 8px 28px rgba(0,0,0,0.45));
      }
      #kx-wordmark {
        font-weight: 800; font-size: 2rem; letter-spacing: -0.01em;
        color: #f5f5f0; margin-top: 14px;
      }
      #kx-wordmark span { color: #4ade80; font-weight: 900; }

      @media screen and (min-width: 641px) {
        #kx-centerLogo img { width: 260px; height: 260px; }
        #kx-wordmark { font-size: 2.4rem; }
      }
      @media screen and (max-width: 640px) {
        #kx-centerLogo img { width: 42vw; height: 42vw; max-width: 220px; max-height: 220px; }
        #kx-wordmark { font-size: 1.8rem; }
        /* Mobile portrait: the diamond gap opened by kx-shrunk is
           narrower relative to badge width than on desktop, so shrink
           the quadrants a touch further to guarantee the mascot
           never visually overlaps a photo edge on tall/narrow phones. */
        .kx-photo.kx-shrunk { width: 38vw; height: 40vh; }
        #kx-photoTR.kx-shrunk { left: 62vw; }
        #kx-photoBL.kx-shrunk { top: 60vh; }
        #kx-photoBR.kx-shrunk { top: 60vh; left: 62vw; }
      }

      /* Static fallback: prefers-reduced-motion skips photo animation
         entirely and shows only the badge, faded in once, no motion. */
      @media (prefers-reduced-motion: reduce) {
        #kx-photoLayer, #kx-overlay { display: none !important; }
        #kx-splash { background: #14532d; }
        .kx-photo { transition: none !important; }
        #kx-centerLogo { transition-duration: 0.01ms !important; }
      }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kuetx_theme');
          var themeId = raw ? JSON.parse(raw) : 'light';
          var palettes = {
            light: { bg: '#f5f5f2', surface: '#ffffff', border: '#e2e0db' },
            milky: { bg: '#faf6ef', surface: '#fff8f0', border: '#e5d9c8' },
            dark:  { bg: '#0a0a0c', surface: '#14141a', border: '#27272f' },
          };
          var p = palettes[themeId] || palettes.light;
          var root = document.documentElement;
          root.style.setProperty('--shell-bg', p.bg);
          root.style.setProperty('--shell-surface', p.surface);
          root.style.setProperty('--shell-border', p.border);
          if (themeId === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc) — skeleton just
          // falls back to its light-theme default colors above.
        }
      })();
    </script>

  <body>
    <div id="root"><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">KUETx — The Digital Ecosystem for KUET</h1><div id="app-shell-skeleton"><div class="sk-sidebar"></div><div class="sk-main"><div class="sk-topbar"></div></div></div></div>

    <script>
      // Only paint the "Minimal Badge Zoom" splash once per browser session —
      // first cold load of the tab. Every subsequent internal navigation or
      // refresh-within-session skips straight to #app-shell-skeleton like
      // before, so returning users are never slowed down by a sequence
      // they've already seen. sessionStorage (not localStorage) is
      // deliberate: a brand-new tab/session gets the splash again, but
      // reloading the SAME tab repeatedly during normal use does not.
      (function () {
        try {
          if (sessionStorage.getItem('kx_splash_shown')) return;
          sessionStorage.setItem('kx_splash_shown', '1');
        } catch (e) {
          // sessionStorage unavailable (private mode) — fall through and
          // show the splash anyway, just won't be remembered for next tab.
        }

        // Four campus photos, one per screen quadrant (top-left,
        // top-right, bottom-left, bottom-right) — fixed positions, not a
        // sequence, so there's no ordering to tune.
        var QUADRANTS = [
          { id: 'kx-photoTL', src: '/splash/gate.webp',     alt: 'KUET main gate' },
          { id: 'kx-photoTR', src: '/splash/academic.webp', alt: 'KUET academic building' },
          { id: 'kx-photoBL', src: '/splash/aerial.webp',   alt: 'Aerial view of KUET campus' },
          { id: 'kx-photoBR', src: '/splash/sign.webp',     alt: 'KUET sign at dusk' },
        ];

        var el = document.createElement('div');
        el.id = 'kx-splash';
        el.innerHTML =
          '<div id="kx-photoLayer">' +
            QUADRANTS.map(function (q) {
              return '<div class="kx-photo" id="' + q.id + '" ' +
                     'role="img" aria-label="' + q.alt + '" style="background-image:url(\'' + q.src + '\')"></div>';
            }).join('') +
          '</div>' +
          '<div id="kx-overlay"></div>' +
          '<div id="kx-centerLogo">' +
            '<img src="/splash/mascot.webp" width="260" height="260" alt="" />' +
            '<div id="kx-wordmark">KUET<span>x</span></div>' +
          '</div>';
        document.body.appendChild(el);

        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var centerLogo = document.getElementById('kx-centerLogo');
        var overlay = document.getElementById('kx-overlay');
        var photoEls = QUADRANTS.map(function (q) { return document.getElementById(q.id); });

        function hideSplash() {
          el.classList.add('kx-hide');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 400);
        }

        if (reduceMotion) {
          // Static fallback: no photo motion, mascot appears once, short hold, done.
          centerLogo.classList.add('kx-show');
          setTimeout(hideSplash, 1400);
          return;
        }

        // Timeline (~4.7s total) — enter → establish → shrink → badge:
        //   0ms     all 4 quadrants start off-canvas, animation frame
        //           requested so the browser paints the off-canvas start
        //           position first (otherwise the very first transition
        //           has nothing to animate from and just snaps in place)
        //   50ms    kx-arrived added — quadrants slide+scale in together,
        //           converging into a seamless full-screen tile (1.1s)
        //   1150ms  arrival transition finishes — photos now fully
        //           "established" as one tiled campus image
        //   1150–1850ms  deliberate 700ms HOLD with nothing changing, so
        //           the fully-assembled photo genuinely registers before
        //           anything moves again (this was previously only ~300ms
        //           and read as rushed — the tile barely settled before
        //           shrinking)
        //   1850ms  overlay darken and kx-shrunk fire together — shrink
        //           and darken read as one combined "opening up" motion
        //           rather than two separate events (1s)
        //   2150ms  badge starts fading/scaling into the opening gap,
        //           timed to land a beat after the shrink is visibly
        //           under way but before it fully completes, so the badge
        //           arrival and the last bit of shrink resolve together
        //   2650ms  badge settled, clock starts ticking
        //   4200ms  badge starts fade+scale out
        //   4500ms  splash background starts fading, revealing app
        //   4800ms  splash removed from DOM
        var ARRIVE_DELAY = 50;
        var ARRIVE_DURATION = 1100;
        var ESTABLISH_HOLD = 700;
        var SHRINK_DELAY = ARRIVE_DELAY + ARRIVE_DURATION + ESTABLISH_HOLD; // 1850ms
        var BADGE_ENTER_DELAY = SHRINK_DELAY + 300; // 2150ms — shrink well under way
        var CLOCK_START_DELAY = BADGE_ENTER_DELAY + 500; // 2650ms — badge settled
        var TOTAL_DURATION = 4500;
        var BADGE_EXIT_LEAD = 300;

        function startTimeline() {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              photoEls.forEach(function (p) { p.classList.add('kx-arrived'); });
            });

            // Overlay darken and shrink fire together — one continuous
            // "photos settle back to reveal the badge" beat instead of
            // the darken pre-empting the shrink by a second.
            setTimeout(function () {
              overlay.classList.add('kx-show');
              photoEls.forEach(function (p) { p.classList.add('kx-shrunk'); });
            }, SHRINK_DELAY);

            setTimeout(function () {
              centerLogo.classList.add('kx-show');
            }, BADGE_ENTER_DELAY);

            setTimeout(function () {
              centerLogo.classList.remove('kx-show');
              centerLogo.classList.add('kx-hide-badge');
            }, TOTAL_DURATION - BADGE_EXIT_LEAD);

            setTimeout(function () {
              el.style.opacity = 0;
            }, TOTAL_DURATION - 100);

            setTimeout(hideSplash, TOTAL_DURATION + 300);
          });
        }

        // Preload all 4 quadrant photos first (hard cap so a stalled
        // request never blocks the splash indefinitely) so the
        // slide-in-to-cover motion never shows a blank/pop-in frame.
        var PRELOAD_MAX_WAIT = 1200;
        var loadedCount = 0;
        var started = false;
        function maybeStart() {
          if (started) return;
          started = true;
          startTimeline();
        }
        QUADRANTS.forEach(function (q) {
          var img = new Image();
          img.onload = img.onerror = function () {
            loadedCount += 1;
            if (loadedCount === QUADRANTS.length) maybeStart();
          };
          img.src = q.src;
        });
        setTimeout(maybeStart, PRELOAD_MAX_WAIT); // cap the wait either way
      })();
    </script>

    <script>
      // BUGFIX (slow-start-after-deploy): sw.js intentionally never calls
      // self.skipWaiting() on its own — a freshly-installed SW used to sit
      // in "waiting" forever with nothing here ever telling it to
      // activate, so the OLD service worker kept serving the OLD cached
      // index.html/app-shell on every load after a real deploy. The first
      // sign anyone actually got that a new version existed was a stale
      // JS chunk 404'ing mid-session (new deploy = new hashed filenames),
      // caught reactively by ErrorBoundary.jsx's ChunkLoadError handler,
      // which then force-reloaded the page — i.e. the app rendered once
      // in a half-broken state, THEN reloaded a second time to actually
      // work. That's the "app takes a while to start after an update"
      // symptom: two full loads instead of one.
      //
      // Fix: the moment registration.waiting exists (a new SW is
      // installed and sitting idle) — whether it's already there at
      // register time, or shows up later via 'updatefound' — tell it to
      // skipWaiting immediately. controllerchange then fires exactly
      // once, and THAT is the only point this ever reloads: at most once,
      // right when the new SW actually takes control, never twice, and
      // never dependent on a chunk failing first. reloading flag guards
      // against a double controllerchange firing two reloads back to back.
      if ('serviceWorker' in navigator &&
          window.location.hostname !== 'localhost' &&
          window.location.hostname !== '127.0.0.1' &&
          window.location.hostname !== '::1') {
        let reloading = false;
        const activateWaiting = (reg) => {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        };

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          // BUGFIX (install button disappearing after an SW update): if a
          // beforeinstallprompt event is currently sitting captured in
          // React state (see useInstallPrompt.js), reloading right now
          // would throw it away — and Chrome doesn't reliably refire it
          // on the next load, so the Install button would just vanish
          // for good. Wait for the person to act on it (or dismiss it)
          // before taking the update; re-check on a short interval
          // instead of reloading blind.
          const tryReload = () => {
            if (window.__kxInstallPromptPending) {
              setTimeout(tryReload, 1000);
              return;
            }
            if (reloading) return;
            reloading = true;
            window.location.reload();
          };
          tryReload();
        });

        // BUGFIX/perf (install prompt taking longer than necessary to
        // become eligible): registration used to be gated behind the
        // window 'load' event, which only fires after every image, font,
        // and script on the page has finished — on a slower connection
        // that can be several seconds. Chrome's own "has this page had a
        // working, controlling service worker for a little while" signal
        // (part of its install-eligibility engagement check — see
        // useInstallPrompt.js's header comment on why this can't be
        // skipped outright) only starts counting once registration
        // actually happens, so registering as soon as the browser
        // supports it — not waiting for 'load' — gives that clock the
        // earliest possible start. Doesn't change what Chrome requires,
        // only removes an unnecessary delay from our side of it.
        const registerNow = () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Case 1: a new SW was already installed and waiting from a
            // PREVIOUS visit (e.g. tab was open when the deploy landed,
            // browser was closed before it could activate) — catch that
            // immediately on this fresh load instead of waiting for the
            // user to notice anything broken.
            activateWaiting(reg);

            // Case 2: a new SW starts installing THIS visit (deploy
            // happened while already on the page, or first-ever
            // registration on a slow connection) — as soon as it finishes
            // installing, activate it right away too.
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  activateWaiting(reg);
                }
              });
            });
          }).catch(() => {});
        };

        if (document.readyState === 'complete') {
          registerNow();
        } else {
          window.addEventListener('load', registerNow);
        }
      }
    </script>
  </body>
</html>
