    <!-- ── Pre-React app-shell skeleton ─────────────────────────────────────
         Fixes "blank/Loading… screen on refresh" — the previous plain-text
         gate (App.jsx) only showed AFTER React mounted and Firebase/auth
         resolved, which on a slow connection or cold cache could take a
         visible moment. This skeleton paints INSTANTLY (pure HTML/CSS,
         parsed before any JS runs), shaped like the real sidebar+topbar
         layout, so the very first thing anyone ever sees looks like "the
         app is already here" rather than a loading state. React's first
         real render replaces #root's innerHTML automatically (React always
         takes full ownership of its mount node on initial render), so this
         disappears the instant real content is ready — nothing here needs
         to manually remove it.
         Theme (light/dark/milky) is read synchronously from localStorage's
         kuetx_theme mirror (see src/store/store.js's store.set, which
         writes to both memoryCache and localStorage) so the skeleton's
         colors match whatever the person last chose, with zero flash. -->
    <style>
      #app-shell-skeleton {
        position: fixed; inset: 0; z-index: 9999;
        display: flex;
        background: var(--shell-bg, #f5f5f2);
      }
      #app-shell-skeleton .sk-sidebar {
        width: 192px; height: 100vh; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-right: 1px solid var(--shell-border, #e2e0db);
      }
      #app-shell-skeleton .sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #app-shell-skeleton .sk-topbar {
        height: 56px; flex-shrink: 0;
        background: var(--shell-surface, #ffffff);
        border-bottom: 1px solid var(--shell-border, #e2e0db);
      }
      @media (max-width: 768px) {
        #app-shell-skeleton .sk-sidebar { display: none; }
      }
    </style>

    <!-- ── Cold-start splash (orbit-carousel: photos glide around a fixed
         centered logo) ────────────────────────────────────────────────
         Shown ONCE per browser session (sessionStorage flag below) on the
         very first cold load — NOT on every internal route change, and NOT
         on repeat visits within the same tab session, so it never gets in
         the way of someone who's already using the app. It sits ON TOP OF
         #app-shell-skeleton (higher z-index) and fades itself out at the
         end of the sequence or as soon as React has mounted real content,
         whichever the person's device/network allows — it never blocks or
         delays the real app underneath; #app-shell-skeleton and React are
         both loading normally the whole time behind it.

         Design: the KUETx turtle mascot sits fixed and calm at dead center
         for the ENTIRE sequence (never moves, gentle breathing pulse only).
         Four campus photo cards drift in from off-screen along soft
         curved paths, pass near — but never over — the logo, and drift
         back out, one at a time. Each card uses object-fit: contain-style
         sizing (width/height capped, aspect-ratio preserved via <img>,
         never CSS background-cover) so a landscape photo is NEVER
         zoomed/cropped into an unrecognizable sliver on wide desktop
         screens — this replaces the old background-cover cinematic scenes,
         which is exactly what caused the bad desktop cropping.
         All four photos are local files under /public/splash/ (see
         STATIC_ASSETS in sw.js — precached there for offline use),
         pre-compressed ahead of time, no runtime image processing, no
         external requests. Respects prefers-reduced-motion by skipping
         straight to a static logo instead of the orbit sequence. -->
    <style>
      #kx-splash {
        position: fixed; inset: 0; z-index: 10000;
        background: radial-gradient(ellipse at 50% 50%, #123a24 0%, #0c2718 55%, #081a10 100%);
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.8s ease;
      }
      #kx-splash.kx-hide {
        opacity: 0;
        pointer-events: none;
      }

      /* Center logo — present and stable for the entire sequence */
      #kx-centerLogo {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(0.82);
        display: flex; flex-direction: column; align-items: center;
        gap: 14px;
        opacity: 0;
        z-index: 5;
        transition: opacity 1s ease, transform 1s cubic-bezier(0.34,1.56,0.64,1);
      }
      #kx-centerLogo.kx-show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      #kx-centerLogo img {
        width: 76px; height: 76px;
        filter: drop-shadow(0 6px 22px rgba(0,0,0,0.45));
        animation: kx-breathe 3.2s ease-in-out infinite;
      }
      #kx-centerLogo.kx-settle img { width: 92px; height: 92px; }
      @keyframes kx-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.045); }
      }
      #kx-wordmark { font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: #f5f5f0; }
      #kx-wordmark span { color: #4ade80; font-weight: 900; }
      #kx-tagline {
        font-size: 11.5px; color: rgba(255,255,255,0.55);
        letter-spacing: 0.08em; text-transform: uppercase;
        opacity: 0; transition: opacity 1s ease;
      }
      #kx-tagline.kx-show { opacity: 1; }
      #kx-dots { display: flex; gap: 6px; opacity: 0; transition: opacity 0.6s ease; }
      #kx-dots.kx-show { opacity: 1; }
      #kx-dots span {
        width: 5px; height: 5px; border-radius: 50%;
        background: #4ade80;
        animation: kx-pulse 1.2s ease-in-out infinite;
      }
      #kx-dots span:nth-child(2) { animation-delay: 0.15s; }
      #kx-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes kx-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      /* Orbit photo cards — each card is positioned/animated individually
         via inline style + a per-card class added by JS at the right
         moment, so timing is controlled from one place (the JS timeline)
         rather than duplicated magic numbers in keyframes. */
      #kx-orbit {
        position: absolute; inset: 0;
        z-index: 3;
      }
      .kx-card {
        position: absolute;
        left: 50%; top: 50%;
        width: min(30vw, 300px);
        aspect-ratio: 4 / 3;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 14px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
        opacity: 0;
        will-change: transform, opacity;
        transition: opacity 0.9s ease, transform 1.6s cubic-bezier(0.22,1,0.36,1);
      }
      .kx-card img {
        width: 100%; height: 100%;
        object-fit: cover; /* fills the fixed-aspect CARD, never the screen — the card itself is sized to a safe box, so no viewport-wide crop */
        display: block;
      }
      /* Each card gets its own resting position, offset from center,
         reached only via the transform JS applies — base state below is
         purely "gathered at center, invisible", so every card's first
         visible state is easy to reason about. */
      .kx-card { transform: translate(-50%, -50%) scale(0.4); }
      .kx-card.kx-in {
        opacity: 1;
      }
      .kx-card.kx-out {
        opacity: 0;
        transition: opacity 0.9s ease, transform 1.3s cubic-bezier(0.4,0,1,1);
      }
      @media (max-width: 640px) {
        .kx-card { width: min(34vw, 150px); }
      }

      #kx-vignette {
        position: absolute; inset: 0;
        box-shadow: inset 0 0 140px 50px rgba(3,8,5,0.5);
        pointer-events: none;
        z-index: 4;
      }

      /* Static fallback: prefers-reduced-motion skips the orbit sequence
         entirely and shows only the logo, faded in once, no motion. */
      @media (prefers-reduced-motion: reduce) {
        #kx-orbit { display: none !important; }
        #kx-splash { background: #14532d; }
        #kx-centerLogo, #kx-tagline, #kx-dots { transition-duration: 0.01ms !important; }
        #kx-centerLogo img { animation: none !important; }
      }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kuetx_theme');
          var themeId = raw ? JSON.parse(raw) : 'light';
          var palettes = {
            light: { bg: '#f5f5f2', surface: '#ffffff', border: '#e2e0db' },
            milky: { bg: '#faf6ef', surface: '#fff8f0', border: '#e5d9c8' },
            dark:  { bg: '#0a0a0c', surface: '#14141a', border: '#27272f' },
          };
          var p = palettes[themeId] || palettes.light;
          var root = document.documentElement;
          root.style.setProperty('--shell-bg', p.bg);
          root.style.setProperty('--shell-surface', p.surface);
          root.style.setProperty('--shell-border', p.border);
          if (themeId === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc) — skeleton just
          // falls back to its light-theme default colors above.
        }
      })();
    </script>

  <body>
    <div id="root"><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">KUETx — The Digital Ecosystem for KUET</h1><div id="app-shell-skeleton"><div class="sk-sidebar"></div><div class="sk-main"><div class="sk-topbar"></div></div></div></div>

    <script>
      // Only paint the orbit-carousel splash once per browser session — first
      // cold load of the tab. Every subsequent internal navigation or
      // refresh-within-session skips straight to #app-shell-skeleton like
      // before, so returning users are never slowed down by a sequence
      // they've already seen. sessionStorage (not localStorage) is
      // deliberate: a brand-new tab/session gets the splash again, but
      // reloading the SAME tab repeatedly during normal use does not.
      (function () {
        try {
          if (sessionStorage.getItem('kx_splash_shown')) return;
          sessionStorage.setItem('kx_splash_shown', '1');
        } catch (e) {
          // sessionStorage unavailable (private mode) — fall through and
          // show the splash anyway, just won't be remembered for next tab.
        }

        // Four campus photo cards. Each rests at a fixed corner-ish spot
        // around the center logo (never overlapping it), entering from
        // just off-screen in that same direction and exiting back the
        // same way — a calm, symmetric "gather around the mascot" motion
        // rather than a spinning/orbiting blur. Positions are expressed
        // as translate offsets from dead-center (left:50%/top:50% base),
        // so they scale naturally with viewport size instead of using
        // fixed pixel corners that would break on small screens.
        // Rest/from offsets are expressed as % of each card's OWN box size
        // (CSS translate % semantics), so they need different magnitudes
        // on narrow phones (where .kx-card is ~40vw) vs desktop (~30vw
        // capped at 300px) to land in the same *visual* place relative to
        // the viewport — otherwise a phone-width card translated by the
        // desktop-tuned percentage drifts off-screen entirely.
        var isNarrow = window.innerWidth <= 640;
        var CARDS = isNarrow ? [
          { src: '/splash/gate.webp',   alt: 'KUET main gate',                 rest: 'translate(-68%, -102%) rotate(-3deg)',  from: 'translate(-140%, -210%) rotate(-3deg)' },
          { src: '/splash/statue.webp', alt: 'Liberation War memorial statue', rest: 'translate(68%, -102%) rotate(2deg)',    from: 'translate(140%, -210%) rotate(2deg)' },
          { src: '/splash/aerial.webp', alt: 'Aerial view of KUET campus',     rest: 'translate(-68%, 102%) rotate(2deg)',    from: 'translate(-140%, 210%) rotate(2deg)' },
          { src: '/splash/sign.webp',   alt: 'KUET sign at dusk',              rest: 'translate(68%, 102%) rotate(-2deg)',    from: 'translate(140%, 210%) rotate(-2deg)' },
        ] : [
          { src: '/splash/gate.webp',   alt: 'KUET main gate',                 rest: 'translate(-128%, -78%) rotate(-3deg)',  from: 'translate(-230%, -160%) rotate(-3deg)' },
          { src: '/splash/statue.webp', alt: 'Liberation War memorial statue', rest: 'translate(30%, -86%) rotate(2deg)',     from: 'translate(70%, -220%) rotate(2deg)' },
          { src: '/splash/aerial.webp', alt: 'Aerial view of KUET campus',     rest: 'translate(-132%, 74%) rotate(2deg)',    from: 'translate(-250%, 170%) rotate(2deg)' },
          { src: '/splash/sign.webp',   alt: 'KUET sign at dusk',              rest: 'translate(34%, 80%) rotate(-2deg)',     from: 'translate(80%, 200%) rotate(-2deg)' },
        ];

        var el = document.createElement('div');
        el.id = 'kx-splash';
        el.innerHTML =
          '<div id="kx-orbit">' +
            CARDS.map(function (c, i) {
              return '<div class="kx-card" id="kx-card' + i + '" style="transform:' + c.from + ' scale(0.4)">' +
                       '<img src="' + c.src + '" alt="' + c.alt + '" loading="eager" />' +
                     '</div>';
            }).join('') +
          '</div>' +
          '<div id="kx-vignette"></div>' +
          '<div id="kx-centerLogo">' +
            '<img src="/icon-512.png" width="76" height="76" alt="" />' +
            '<div id="kx-wordmark">KUET<span>x</span></div>' +
            '<div id="kx-tagline">The digital ecosystem for KUET</div>' +
            '<div id="kx-dots"><span></span><span></span><span></span></div>' +
          '</div>';
        document.body.appendChild(el);

        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var centerLogo = document.getElementById('kx-centerLogo');
        var tagline = document.getElementById('kx-tagline');
        var dots = document.getElementById('kx-dots');
        var cardEls = CARDS.map(function (_, i) { return document.getElementById('kx-card' + i); });

        function hideSplash() {
          el.classList.add('kx-hide');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 800);
        }

        if (reduceMotion) {
          // Static fallback: no photo motion, logo appears once, short hold, done.
          centerLogo.classList.add('kx-show', 'kx-settle');
          tagline.classList.add('kx-show');
          dots.classList.add('kx-show');
          setTimeout(hideSplash, 1400);
          return;
        }

        // Timeline (~12s total): logo settles in first and stays fixed at
        // center the whole time. Cards then glide in one by one to rest
        // near (never over) the logo, hold together as a group so the
        // full "family photo" of the campus is visible at once, then
        // glide back out one by one in the same order. Logo enlarges
        // slightly and the tagline/dots settle in as the cards clear,
        // handing off cleanly to the real app underneath.
        requestAnimationFrame(function () {
          setTimeout(function () { centerLogo.classList.add('kx-show'); }, 60);

          var ENTER_START = 600;
          var ENTER_STAGGER = 550;
          cardEls.forEach(function (card, i) {
            setTimeout(function () {
              card.style.transform = CARDS[i].rest + ' scale(1)';
              card.classList.add('kx-in');
            }, ENTER_START + i * ENTER_STAGGER);
          });

          // Hold: all four cards visible together around the mascot —
          // this is the main "look at the campus" beat, given the most
          // time so it never feels rushed.
          var HOLD_UNTIL = ENTER_START + cardEls.length * ENTER_STAGGER + 3800;

          var EXIT_START = HOLD_UNTIL;
          var EXIT_STAGGER = 380;
          cardEls.forEach(function (card, i) {
            setTimeout(function () {
              card.classList.remove('kx-in');
              card.classList.add('kx-out');
              card.style.transform = CARDS[i].from + ' scale(0.4)';
            }, EXIT_START + i * EXIT_STAGGER);
          });

          var SETTLE_AT = EXIT_START + cardEls.length * EXIT_STAGGER + 400; // logo grows slightly, tagline/dots fade in
          setTimeout(function () {
            centerLogo.classList.add('kx-settle');
            tagline.classList.add('kx-show');
            dots.classList.add('kx-show');
          }, SETTLE_AT);

          // Hold the settled logo+tagline briefly on its own before
          // handing off, so the ending doesn't feel abrupt — then hard
          // cap resolves to the real app by ~12s total even if the
          // browser is under load and timers drift, so the splash can
          // never strand someone indefinitely in front of it.
          setTimeout(hideSplash, SETTLE_AT + 2900);
        });
      })();
    </script>

    <script>
      // BUGFIX (slow-start-after-deploy): sw.js intentionally never calls
      // self.skipWaiting() on its own — a freshly-installed SW used to sit
      // in "waiting" forever with nothing here ever telling it to
      // activate, so the OLD service worker kept serving the OLD cached
      // index.html/app-shell on every load after a real deploy. The first
      // sign anyone actually got that a new version existed was a stale
      // JS chunk 404'ing mid-session (new deploy = new hashed filenames),
      // caught reactively by ErrorBoundary.jsx's ChunkLoadError handler,
      // which then force-reloaded the page — i.e. the app rendered once
      // in a half-broken state, THEN reloaded a second time to actually
      // work. That's the "app takes a while to start after an update"
      // symptom: two full loads instead of one.
      //
      // Fix: the moment registration.waiting exists (a new SW is
      // installed and sitting idle) — whether it's already there at
      // register time, or shows up later via 'updatefound' — tell it to
      // skipWaiting immediately. controllerchange then fires exactly
      // once, and THAT is the only point this ever reloads: at most once,
      // right when the new SW actually takes control, never twice, and
      // never dependent on a chunk failing first. reloading flag guards
      // against a double controllerchange firing two reloads back to back.
      if ('serviceWorker' in navigator &&
          window.location.hostname !== 'localhost' &&
          window.location.hostname !== '127.0.0.1' &&
          window.location.hostname !== '::1') {
        let reloading = false;
        const activateWaiting = (reg) => {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        };

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          // BUGFIX (install button disappearing after an SW update): if a
          // beforeinstallprompt event is currently sitting captured in
          // React state (see useInstallPrompt.js), reloading right now
          // would throw it away — and Chrome doesn't reliably refire it
          // on the next load, so the Install button would just vanish
          // for good. Wait for the person to act on it (or dismiss it)
          // before taking the update; re-check on a short interval
          // instead of reloading blind.
          const tryReload = () => {
            if (window.__kxInstallPromptPending) {
              setTimeout(tryReload, 1000);
              return;
            }
            if (reloading) return;
            reloading = true;
            window.location.reload();
          };
          tryReload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Case 1: a new SW was already installed and waiting from a
            // PREVIOUS visit (e.g. tab was open when the deploy landed,
            // browser was closed before it could activate) — catch that
            // immediately on this fresh load instead of waiting for the
            // user to notice anything broken.
            activateWaiting(reg);

            // Case 2: a new SW starts installing THIS visit (deploy
            // happened while already on the page, or first-ever
            // registration on a slow connection) — as soon as it finishes
            // installing, activate it right away too.
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  activateWaiting(reg);
                }
              });
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
