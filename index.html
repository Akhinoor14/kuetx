<!DOCTYPE html>

    <link rel="manifest" href="/manifest.json" />

    <!-- offline: no external preconnect to fonts -->
    <!-- Use system fonts for full offline support -->
    <style>html,body{font-family: system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans","Helvetica Neue",Arial;}</style>
    <link href="/vendor/fullcalendar-fallback.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- FullCalendar removed: using local simple calendar component instead -->
    <script>
      if ('serviceWorker' in navigator &&
          window.location.hostname !== 'localhost' &&
          window.location.hostname !== '127.0.0.1' &&
          window.location.hostname !== '::1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
