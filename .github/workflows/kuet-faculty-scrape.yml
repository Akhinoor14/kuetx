# প্রতিদিন নিজে থেকে চলবে — কোনো server/VPS লাগবে না, GitHub Actions
# free tier যথেষ্ট (public repo হলে সম্পূর্ণ free, private repo হলেও
# free minutes-এর মধ্যেই থাকবে এই ছোট job-টার জন্য)।
#
# সেটআপ করতে যা লাগবে (একবারই):
#   1. Firebase Console -> Project Settings -> Service Accounts ->
#      "Generate new private key" — JSON ফাইল ডাউনলোড হবে।
#      (নিরাপত্তার জন্য: একটা নতুন, শুধু facultyDirectory collection-এ
#      write access আছে এমন restricted service account বানানোই ভালো,
#      পুরো project-এর owner key ব্যবহার না করে।)
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      "New repository secret" -> নাম: FIREBASE_SERVICE_ACCOUNT_JSON,
#      value: ওই JSON ফাইলের পুরো content পেস্ট করো।
#   3. এই ফাইলটা repo-তে commit/push করলেই schedule active হয়ে যাবে —
#      আলাদা কিছু "enable" করতে হবে না।
#
# ম্যানুয়ালি টেস্ট করতে চাইলে: GitHub repo -> Actions tab -> এই
# workflow সিলেক্ট করো -> "Run workflow" বাটন (workflow_dispatch এর
# জন্য নিচে যোগ করা আছে)।

name: KUET Faculty Directory Scrape

# NOTE (twice-a-month schedule): GitHub Actions cron-এ সরাসরি "মাসে ২ বার,
# ১ম আর ৩য় শুক্রবার" বলার কোনো syntax নেই (cron শুধু day-of-month/
# day-of-week বোঝে, "nth weekday of month" বোঝে না)। তাই workflow প্রতি
# বৃহস্পতিবার রাতেই (UTC) ট্রিগার হয় — যেটা Bangladesh সময়ে (UTC+6)
# শুক্রবার ভোর ৩টায় পড়ে — কিন্তু "Check if this is a scrape week"
# step-এ আসল BD-local তারিখ হিসাব করে সেই তারিখটা মাসের ১ম না ৩য়
# শুক্রবার কিনা যাচাই করা হয়, বাকি শুক্রবারগুলো (২য়/৪র্থ/৫ম) বাদ দেওয়া
# হয় — ফলে কার্যত মাসে ঠিক ২ বার (১ম ও ৩য় শুক্রবার, BD রাত ৩টা) স্ক্র্যাপ
# চলে। Firestore quota বাঁচাতে এই gate; scraper.py-এর নিজস্ব diff-based
# write logic (শুধু বদলানো ডেটা লেখা)-এর পাশাপাশি এটা দ্বিতীয় স্তরের
# সুরক্ষা।
on:
  schedule:
    # প্রতি বৃহস্পতিবার রাত ৯টা UTC => বাংলাদেশ সময় (UTC+6) শুক্রবার
    # ভোর ৩টা — gate step এই ট্রিগারগুলোর মধ্যে শুধু ১ম/৩য়
    # শুক্রবারগুলোতেই আসল scrape চালায়, বাকিগুলোতে skip করে।
    - cron: "0 21 * * 4"
  workflow_dispatch: {} # Actions tab থেকে ম্যানুয়ালি "Run workflow" চাপার অপশন — এটা সবসময় চলে, gate এড়িয়ে

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if this is a scrape week (1st/3rd Friday gate)
        id: gate
        run: |
          # workflow_dispatch (ম্যানুয়াল রান) হলে gate সবসময় pass —
          # কেউ ইচ্ছে করে চালালে তাকে থামানো উচিত না।
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — skipping 1st/3rd-Friday check."
            exit 0
          fi
          # Runner UTC সময়ে চলে, কিন্তু আমাদের দরকার Bangladesh-local
          # (UTC+6) তারিখ — কারণ ট্রিগারটা UTC বৃহস্পতিবার রাতে হলেও
          # সেটা BD সময়ে ইতিমধ্যে শুক্রবার ভোর হয়ে গেছে। ৬ ঘন্টা যোগ
          # করে BD-local তারিখ বের করা হচ্ছে।
          bd_day=$(date -u -d '+6 hours' +%-d)
          # মাসের কোন সংখ্যক শুক্রবার এটা (1st, 2nd, 3rd, ...)? দিন ১-৭
          # => 1st, ৮-১৪ => 2nd, ১৫-২১ => 3rd, ২২-২৮ => 4th, ২৯+ => 5th।
          nth_friday=$(( (bd_day - 1) / 7 + 1 ))
          if [ "$nth_friday" = "1" ] || [ "$nth_friday" = "3" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "BD date day $bd_day — the ${nth_friday}th Friday of the month, scraping."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "BD date day $bd_day — the ${nth_friday}th Friday of the month, skipping to save Firestore quota."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: scripts
        run: pip install -r requirements.txt

      - name: Run scraper (scrape + push to Firestore)
        if: steps.gate.outputs.run == 'true'
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python kuet_faculty_scraper.py

      - name: Upload JSON snapshot as run artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kuet-faculty-data
          path: scripts/kuet_faculty_data.json
          retention-days: 14
